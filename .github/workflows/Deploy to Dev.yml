name: Deploy UiPath Process

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Keep in sync with your local CLI (`uip --version`) so CI and local
  # behave identically.
  CLI_VERSION:      '1.198.0'
  NODE_VERSION:     '20'

  # Must match the "name" field in project.json — the CLI derives the
  # package ID from the manifest, not from any flag.
  PACKAGE_NAME:     'HelloWorld_SuccessTest'

  # Bump this for each release. Orchestrator rejects re-uploading an
  # existing name+version pair.
  PACKAGE_VERSION:  '1.0.2'

  # Project directory (project.json sits at the repo root).
  PROJECT_PATH:     '.'

  # Orchestrator folder. "Tests" sits directly under the tenant.
  FOLDER_PATH:      'Tests'

  OUTPUT_DIR:       './dist'

jobs:

  build:
    name: Pack
    # Windows runner required: project.json has targetFramework "Windows".
    runs-on: windows-latest
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install UiPath CLI
        shell: bash
        run: npm install -g "@uipath/cli@${CLI_VERSION}"

      - name: Pack project
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          # Output must live OUTSIDE the project directory — the packager
          # rejects a destination nested inside it, and the project dir
          # here is the repo root.
          OUT="${RUNNER_TEMP}/nupkg"
          mkdir -p "$OUT"
          uip rpa pack "$PROJECT_PATH" "$OUT" \
            --package-id "$PACKAGE_NAME" \
            --package-version "$PACKAGE_VERSION"
          ls -la "$OUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ${{ steps.pack.outputs.out }}/*.nupkg

  deploy:
    name: Deploy to Orchestrator
    needs: build
    # Orchestrator calls are plain API calls — no Windows dependency.
    runs-on: ubuntu-latest
    environment: uipath-prod   # attach approval gates here if needed
    steps:

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install UiPath CLI
        shell: bash
        run: npm install -g "@uipath/cli@${CLI_VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ${{ env.OUTPUT_DIR }}

      - name: Authenticate
        shell: bash
        env:
          UIPATH_CLIENT_ID:     ${{ secrets.OAUTH_CLIENT_ID }}
          UIPATH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          UIPATH_TENANT:        ${{ vars.UIPATH_TENANT }}
        run: |
          set -euo pipefail
          uip login \
            --client-id env.UIPATH_CLIENT_ID \
            --client-secret env.UIPATH_CLIENT_SECRET \
            --tenant "$UIPATH_TENANT"

      - name: Upload package to tenant feed
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.nupkg' | head -1)
          echo "Uploading $PACKAGE"
          uip or packages upload "$PACKAGE"

      - name: Create or update process
        id: process
        shell: bash
        run: |
          set -euo pipefail

          KEY=$(uip or processes list \
                  --folder-path "$FOLDER_PATH" \
                  --name "$PACKAGE_NAME" \
                  --output-filter 'Data[0].Key' \
                  --output plain || echo "")

          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "No existing process — creating."
            KEY=$(uip or processes create \
                    --folder-path "$FOLDER_PATH" \
                    --name "$PACKAGE_NAME" \
                    --package-key "$PACKAGE_NAME" \
                    --package-version "$PACKAGE_VERSION" \
                    --output-filter 'Data.Key' \
                    --output plain)
          else
            echo "Process exists ($KEY) — bumping version."
            uip or processes update-version "$KEY" \
              --package-version "$PACKAGE_VERSION"
          fi

          echo "process_key=$KEY" >> "$GITHUB_OUTPUT"
